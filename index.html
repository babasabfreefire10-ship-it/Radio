<!DOCTYPE html>
<html lang="sq"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>RADIO BY SABI</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;overscroll-behavior:none}
body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;padding-bottom:110px}
.led{height:2px;background:#111}.led.on{background:#c00000}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}
.logo{display:flex;gap:10px;align-items:center}.badge{width:44px;height:44px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;position:relative}.badge i{position:absolute;right:5px;bottom:4px;width:7px;height:7px;background:#c00000;border-radius:50%}
.lt .a{font-size:22px;font-weight:900}.lt .a em{font-style:normal;color:#c00000}.lt .b{font-size:9px;letter-spacing:3.5px;color:#888;font-weight:800;margin-top:4px}
button{cursor:pointer;background:#111;color:#fff;border:1px solid #333;padding:10px 14px;font-weight:800;border-radius:999px;font-size:13px;touch-action:manipulation}
button:active{transform:scale(.97)}button.active{background:#fff;color:#000;border-color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto}
.player{padding:20px 16px 6px;max-width:920px;margin:0 auto}.kicker{font-size:11px;letter-spacing:3px;color:#888;font-weight:800}
h1{font-size:clamp(46px,13vw,92px);line-height:.88;font-weight:900;margin:10px 0 0;text-transform:uppercase;word-break:break-word}h1 span{color:#c00000}
.sub{color:#c00000;font-weight:900;letter-spacing:2px;margin-top:10px;font-size:14px}.meta{color:#999;font-size:13px;margin-top:6px}
.progress{display:flex;align-items:center;gap:10px;margin-top:20px}.t{font-size:12px;color:#999;width:38px}.track{flex:1;height:4px;background:#222;border-radius:99px;overflow:hidden}.fill{height:100%;width:0%;background:#2b7fff}
.controls{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:20px}.ctrl{width:52px;height:52px;border-radius:50%;background:#000;color:#fff;font-size:20px}.play-big{width:78px;height:78px;border-radius:50%;background:#fff;color:#000;border:none;font-size:30px}
.row2{display:flex;justify-content:center;gap:10px;margin-top:14px}
.list{max-width:920px;margin:14px auto 0;padding:0 16px}.item{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #1a1a1a;cursor:pointer}.item.active{background:#0a0000}.item .n{color:#666;font-size:13px;width:22px}.item .info{flex:1;min-width:0}.item .info b{font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .info span{color:#888;font-size:12px}.tag{font-size:10px;border:1px solid #333;padding:3px 7px;border-radius:99px;color:#aaa}.play{width:44px;height:44px;border-radius:50%;background:#fff;color:#000;border:none;font-size:18px;flex:0 0 44px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;padding:10px 14px;display:flex;gap:10px;align-items:center;padding-bottom:max(10px,env(safe-area-inset-bottom))}.bar b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.bar small{color:#888}
</style></head><body>
<div class="led" id="led"></div>
<header><div class="logo"><div class="badge">S<i></i></div><div class="lt"><div class="a">RADIO <em>BY SABI</em></div><div class="b">SABI BY SABI</div></div></div><button id="ledBtn">LED OFF</button></header>
<div class="tabs" id="tabs"></div>
<section class="player"><div class="kicker" id="kicker">SABI BY SABI • LIVE</div><h1 id="bigTitle">RADIO<br><span>BY SABI</span></h1><div class="sub" id="bigSub">ZGJIDH NJE KENGE</div><div class="meta" id="bigMeta">Lokale • House • Latitude • Radio Live</div>
<div class="progress"><span class="t" id="t0">0:00</span><div class="track"><div class="fill" id="fill"></div></div><span class="t">LIVE</span></div>
<div class="controls"><button class="ctrl" id="prevBtn">‹</button><button class="play-big" id="mainPlay">▶</button><button class="ctrl" id="nextBtn">›</button></div>
<div class="row2"><button id="detailsBtn">Details</button><button id="listenBtn">Listen</button></div></section>
<div class="list" id="listEl"></div>
<div class="bar"><b><span id="now">GATI</span><br><small id="st">SHTYP PLAY</small></b><button id="stopBtn">STOP</button></div>
<audio id="audio" preload="auto" playsinline></audio>
<script>
const GENRES=["Të Gjitha","Lokale","House","Latitude","Radio Live"];
const tracks=[
 {name:"LOKALE",desc:"TALLAVA • AHENG • 140 BPM",genre:"Lokale",kind:"lokale"},
 {name:"LOKALE 2",desc:"TALLAVA • DASËM • 138 BPM",genre:"Lokale",kind:"lokale2"},
 {name:"HOUSE",desc:"HOUSE • CLUB • 128 BPM",genre:"House",kind:"house"},
 {name:"HOUSE 2",desc:"DEEP HOUSE • 122 BPM",genre:"House",kind:"house2"},
 {name:"LATITUDE",desc:"MELODIC HOUSE • LATITUDE",genre:"Latitude",kind:"latitude"},
 {name:"LATITUDE 2",desc:"MELODIC • BOUNCE",genre:"Latitude",kind:"latitude2"},
 {name:"SABI BEAT",desc:"SABI BY SABI • BOUNCE",genre:"House",kind:"beat"},
 {name:"Radio Tirana 1",desc:"RTSH • Lajme / Pop",genre:"Radio Live",kind:"radio",url:"https://radiolive.rtsh.dev/radiotirana1",hls:true},
 {name:"Radio Tirana 2",desc:"RTSH",genre:"Radio Live",kind:"radio",url:"https://radiolive.rtsh.dev/radiotirana2",hls:true},
 {name:"Radio Divjaka HD",desc:"Pop / Dance / Folk",genre:"Radio Live",kind:"radio",url:"https://stream.zeno.fm/brc5btguqg8uv",hls:false},
 {name:"Radio BLLACA",desc:"Lokale",genre:"Radio Live",kind:"radio",url:"https://stream.zeno.fm/0smrlmhdbxuuv",hls:false},
 {name:"HM Radio",desc:"Folk",genre:"Radio Live",kind:"radio",url:"https://stream.zeno.fm/1nykd3t9f7qtv",hls:false},
];
let filter="Të Gjitha",curIdx=-1;
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.scale&&e.scale!==1)e.preventDefault();},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<300)e.preventDefault();lastTouch=n;},{passive:false});
const audio=document.getElementById('audio');let hls=null;
let ledOn=false;document.getElementById('ledBtn').onclick=()=>{ledOn=!ledOn;document.getElementById('led').className=ledOn?'led on':'led';document.getElementById('ledBtn').textContent=ledOn?'LED OFF':'LED ON';};
let actx=null,master=null,noiseBuf=null,timer=null,step=0,beatOn=false,curKind="";
function ctx(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;actx=new C();master=actx.createGain();master.gain.value=0.9;master.connect(actx.destination);const len=Math.floor(actx.sampleRate*0.08);noiseBuf=actx.createBuffer(1,len,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;} if(actx.state==='suspended')actx.resume(); return actx;}
function kick(t,vol=0.9){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(48,t+0.12);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.28);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.3);}
function hat(t,vol=0.12){const s=actx.createBufferSource();s.buffer=noiseBuf;const f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const g=actx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+0.06);}
function bass(t,freq,vol=0.28,dur=0.4){const o=actx.createOscillator(),fl=actx.createBiquadFilter(),g=actx.createGain();o.type='sawtooth';o.frequency.value=freq;fl.type='lowpass';fl.frequency.value=420;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(fl);fl.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}
function lead(t,freq,vol=0.14){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.03);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.4);}
function darbuka(t){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(90,t+0.09);g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.15);}
const CFG={lokale:{bpm:140,bass:[55,0,65.41,0,55,0,49,58.27],lead:[220,261.63,329.63,261.63,196,220,246.94,220]},lokale2:{bpm:138,bass:[65.41,0,55,0,65.41,0,49,0],lead:[329.63,293.66,261.63,293.66,329.63,392,329.63,261.63]},house:{bpm:128,bass:[55,55,55,55,65.41,55,49,58.27],lead:[0,0,440,0,0,0,523.25,0]},house2:{bpm:122,bass:[49,0,49,0,55,0,49,58.27],lead:[0,392,0,440,0,392,0,329.63]},latitude:{bpm:124,bass:[55,0,0,55,65.41,0,0,49],lead:[440,523.25,659.25,523.25,440,392,440,523.25]},latitude2:{bpm:126,bass:[55,0,55,0,65.41,0,58.27,0],lead:[523.25,659.25,587.33,659.25,783.99,659.25,587.33,523.25]},beat:{bpm:132,bass:[55,0,55,0,65.41,0,49,58.27],lead:[0,0,0,0,0,0,0,0]}};
function playStep(s,kind){const c=CFG[kind]||CFG.beat;const t=actx.currentTime;
 if(kind.includes('lokale')||kind==='lokale2'){if(s%2===0)kick(t,0.9);darbuka(t);if(s%4===2)darbuka(t+0.08);hat(t,0.08);}
 else{kick(t,0.95);hat(t,s%2?0.18:0.08);if(s%4===2){const cl=actx.createBufferSource();cl.buffer=noiseBuf;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;const g=actx.createGain();g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.09);cl.connect(f);f.connect(g);g.connect(master);cl.start(t);cl.stop(t+0.1);}}
 const bf=c.bass[s%8];if(bf)bass(t,bf); const lf=c.lead[s%8];if(lf)lead(t,lf);
 document.getElementById('fill').style.width=(s%16)*6.25+'%';}
function startGen(kind){stopAudio();ctx();curKind=kind;beatOn=true;step=0;playStep(0,kind);const interval=60000/CFG[kind].bpm/2;timer=setInterval(()=>{step++;playStep(step,kind);},interval);document.getElementById('mainPlay').textContent='❚❚';document.getElementById('st').textContent='LIVE • '+kind.toUpperCase();}
function stopGen(){beatOn=false;if(timer){clearInterval(timer);timer=null;}}
function stopAudio(){try{audio.pause();}catch(e){} if(hls){try{hls.destroy();}catch(e){} hls=null;}}
function visible(){return tracks.map((t,i)=>({t,i})).filter(x=>filter==="Të Gjitha"||x.t.genre===filter);}
function playIdx(i){const s=tracks[i];curIdx=i;document.getElementById('bigTitle').innerHTML=s.name.toUpperCase().replace(' ','<br>');document.getElementById('bigSub').textContent=s.desc;document.getElementById('bigMeta').textContent=s.genre+' • '+s.desc;document.getElementById('now').textContent=s.name;document.getElementById('st').textContent='DUKE U LIDHUR...';document.getElementById('fill').style.width='0%';render();
 stopGen();stopAudio();if(s.kind==='radio'){if(s.hls&&window.Hls&&Hls.isSupported()){hls=new Hls({maxBufferLength:10});hls.loadSource(s.url);hls.attachMedia(audio);hls.on(Hls.Events.MANIFEST_PARSED,()=>{audio.volume=1;audio.play().catch(()=>{});});hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)document.getElementById('st').textContent='Nuk u hap - provo tjetrën';});}else{audio.src=s.url;audio.volume=1;audio.load();audio.play().catch(()=>{});}document.getElementById('mainPlay').textContent='❚❚';}else{startGen(s.kind);}}
function toggleMain(){if(curIdx<0){playIdx(0);return;}const s=tracks[curIdx];if(s.kind==='radio'){if(audio.paused){audio.play().catch(()=>{});document.getElementById('mainPlay').textContent='❚❚';}else{audio.pause();document.getElementById('mainPlay').textContent='▶';document.getElementById('st').textContent='PAUSE';}}else{if(beatOn){stopGen();document.getElementById('mainPlay').textContent='▶';document.getElementById('st').textContent='PAUSE';}else{startGen(s.kind);}}}
document.getElementById('mainPlay').onclick=toggleMain;
document.getElementById('prevBtn').onclick=()=>{const v=visible();if(!v.length)return;let p=v.findIndex(x=>x.i===curIdx);playIdx(v[(p-1+v.length)%v.length].i);};
document.getElementById('nextBtn').onclick=()=>{const v=visible();if(!v.length)return;let p=v.findIndex(x=>x.i===curIdx);playIdx(v[(p+1)%v.length].i);};
document.getElementById('stopBtn').onclick=()=>{stopGen();stopAudio();document.getElementById('mainPlay').textContent='▶';document.getElementById('st').textContent='STOP';document.getElementById('now').textContent='GATI';};
document.getElementById('detailsBtn').onclick=()=>{if(curIdx>=0)alert(tracks[curIdx].name+'\n'+tracks[curIdx].desc+'\n'+tracks[curIdx].genre);};
document.getElementById('listenBtn').onclick=()=>{if(curIdx>=0)playIdx(curIdx);else playIdx(0);};
audio.addEventListener('playing',()=>{document.getElementById('st').textContent='LIVE';document.getElementById('fill').style.width='100%';});
audio.addEventListener('timeupdate',()=>{const s=Math.floor(audio.currentTime||0);document.getElementById('t0').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');});
audio.addEventListener('error',()=>{if(curIdx>=0)document.getElementById('st').textContent='Nuk u hap - provo tjetrën';});
function render(){const tabs=document.getElementById('tabs');tabs.innerHTML='';GENRES.forEach(g=>{const b=document.createElement('button');b.textContent=g;b.className=filter===g?'active':'';b.onclick=()=>{filter=g;render();};tabs.appendChild(b);});
 const el=document.getElementById('listEl');el.innerHTML='';visible().forEach((x,idx)=>{const s=x.t;const d=document.createElement('div');d.className='item'+(x.i===curIdx?' active':'');d.innerHTML='<span class="n">'+String(idx+1).padStart(2,'0')+'</span><div class="info"><b>'+s.name+'</b><span>'+s.desc+'</span></div><span class="tag">'+s.genre+'</span><button class="play">▶</button>';d.onclick=()=>playIdx(x.i);el.appendChild(d);});}
render();
</script></body></html>
